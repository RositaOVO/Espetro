name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      esradial_ref:
        description: EsRadial branch/tag/commit to build against
        default: toast-tips

permissions:
  contents: read

env:
  ESRADIAL_REPO: RositaOVO/EsRadial
  ESRADIAL_REF: ${{ inputs.esradial_ref || 'toast-tips' }}
  TETRACHORD_VERSION: 1.20+1.0.3
  TETRACHORD_URL: https://cdn.modrinth.com/data/ltXwBzVu/versions/NuXORCU8/tetrachordlib-1.20%2B1.0.3.jar
  TETRACHORD_SHA1: e1ff34f656e22cc3f85147de0c257b3f18ec0378
  DRAGONRISE_JAR: libs/dragonrise_reforge-1.5.0-beta-20260921.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # EsRadial is consumed from mavenLocal (org.esradial:esradial-forge-1.20.1).
      - name: Checkout EsRadial
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ESRADIAL_REPO }}
          ref: ${{ env.ESRADIAL_REF }}
          path: .deps/EsRadial

      - name: Publish EsRadial to mavenLocal
        working-directory: .deps/EsRadial
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :forge:publishToMavenLocal

      # Tetrachord is consumed from mavenLocal with artifact-only metadata.
      - name: Install Tetrachord into mavenLocal
        run: |
          dir="$HOME/.m2/repository/com/hexagram2021/tetrachordlib/tetrachordlib/$TETRACHORD_VERSION"
          mkdir -p "$dir"
          jar="$dir/tetrachordlib-$TETRACHORD_VERSION.jar"
          curl -fsSL "$TETRACHORD_URL" -o "$jar"
          echo "$TETRACHORD_SHA1  $jar" | sha1sum -c -

      # DragonRise is a compileOnly dependency that cannot be redistributed;
      # compile against a signature-only stub (never packaged).
      - name: Build DragonRise compile stub
        run: |
          mkdir -p .deps/dragonrise-stub libs
          javac --release 17 -d .deps/dragonrise-stub \
            $(find ci/dragonrise-stub -name '*.java')
          jar cf "$DRAGONRISE_JAR" -C .deps/dragonrise-stub .

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: espetro-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
